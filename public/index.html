<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vamonos Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Vamonos Chat 💬</h1>
      <p>Anonymous Chat • No Links Allowed</p>
    </div>

    <div class="chat-container">
      <div class="messages" id="messages">
        <div class="system-message">Welcome to Vamonos! You are anonymous. Links will result in IP ban.</div>
      </div>
    </div>

    <div class="input-container">
      <input 
        type="text" 
        id="messageInput" 
        placeholder="Type your message..." 
        autocomplete="off"
      >
      <button id="sendBtn">Send</button>
    </div>

    <div class="username-display">
      Your name: <span id="username">Loading...</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
