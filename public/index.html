<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vamonos Chat 💬</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💬 Vamonos Chat</h1>
      <div class="stats">
        <span class="stat-item">👥 Aktif: <strong id="users-online">0</strong></span>
      </div>
    </div>
    <div id="chat-container"></div>
    <div class="input-area">
      <input 
        type="text" 
        id="message-input" 
        placeholder="Mesajınızı yazın..."
        autocomplete="off"
      >
      <button id="send-btn">Gönder</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
