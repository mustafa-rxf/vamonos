<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vamonos Chat - Admin Paneli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Login Panel */
        .login-panel {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-panel h1 {
            color: #667eea;
            margin-bottom: 30px;
        }

        .login-panel input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .login-panel input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-panel button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .login-panel button:hover {
            transform: translateY(-2px);
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        /* Section Cards */
        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            display: inline-block;
        }

        /* User List */
        .user-list, .banned-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .user-item, .ban-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }

        .user-item:hover, .ban-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .user-info, .ban-info {
            flex: 1;
        }

        .user-info strong {
            color: #333;
            font-size: 16px;
        }

        .user-info small, .ban-info small {
            display: block;
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }

        /* Buttons */
        .ban-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .ban-btn:hover {
            background: #ff3838;
            transform: scale(1.05);
        }

        .unban-btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .unban-btn:hover {
            background: #00a884;
            transform: scale(1.05);
        }

        .clear-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }

        .clear-btn:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .info {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-card h4 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .user-item, .ban-item {
                flex-direction: column;
                text-align: center;
            }
            
            .ban-btn, .unban-btn {
                margin-left: 0;
                margin-top: 10px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Panel -->
        <div id="loginPanel" class="login-panel">
            <h1>🔐 Admin Paneli</h1>
            <input type="password" id="adminPassword" placeholder="Admin Şifresi" autocomplete="off">
            <button onclick="login()">Giriş Yap</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel">
            <div class="header">
                <h1>🛡️ Vamonos Chat - Admin Paneli</h1>
                <button onclick="logout()" class="logout-btn">🚪 Çıkış Yap</button>
            </div>

            <!-- İstatistikler -->
            <div class="stats">
                <div class="stat-card">
                    <h4>👥 Aktif Kullanıcı</h4>
                    <div class="number" id="statActiveUsers">0</div>
                </div>
                <div class="stat-card">
                    <h4>🚫 Banlı Cihaz</h4>
                    <div class="number" id="statBannedDevices">0</div>
                </div>
            </div>

            <!-- Grid -->
            <div class="grid">
                <!-- Aktif Kullanıcılar -->
                <div class="section">
                    <h3>👥 Aktif Kullanıcılar (Device ID)</h3>
                    <div id="userList" class="user-list">
                        <div class="info">Yükleniyor...</div>
                    </div>
                </div>

                <!-- Banlı Kullanıcılar -->
                <div class="section">
                    <h3>🚫 Banlı Cihazlar</h3>
                    <div id="bannedList" class="banned-list">
                        <div class="info">Yükleniyor...</div>
                    </div>
                    <button onclick="clearAllBans()" class="clear-btn">🗑️ Tüm Banları Temizle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
